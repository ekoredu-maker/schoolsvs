name: Release SchoolSVS RC9

on:
  push:
    branches:
      - hybrid-v0.1
    paths:
      - .github/workflows/release-rc9.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build portable RC9
        shell: powershell
        run: |
          .\hybrid\build_portable.ps1 -PythonVersion '3.11.9' -PackageVersion '0.20.7'
          $source = 'dist\SchoolSVS_Portable_v0.20.7.zip'
          $target = 'dist\SchoolSVS_v0.20.7_RC9.zip'
          if (-not (Test-Path $source)) { throw "Portable ZIP was not created: $source" }
          Copy-Item $source $target -Force
          if (-not (Test-Path $target)) { throw "Release ZIP was not created: $target" }

      - name: Verify release package
        shell: powershell
        run: |
          $zip = 'dist\SchoolSVS_v0.20.7_RC9.zip'
          $check = Join-Path $env:RUNNER_TEMP 'schoolsvs_rc9_check'
          if (Test-Path $check) { Remove-Item $check -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $check -Force
          $required = @(
            'SchoolSVS.vbs',
            'SchoolSVS_Diagnostic.bat',
            'hybrid\app\portable_entry.py',
            'hybrid\web\backup-ui.js',
            'hybrid\web\backup-visibility-patch.js',
            'hybrid\sample-data\schoolsvs_sample_cases.json',
            'hybrid\runtime\python.exe'
          )
          foreach ($item in $required) {
            $path = Join-Path $check $item
            if (-not (Test-Path $path)) { throw "Missing release file: $item" }
          }
          Write-Host 'RC9 release package verification OK'

      - name: Write release notes
        shell: powershell
        run: |
          @'
          SchoolSVS v0.20.7 RC9 시험 배포본입니다.

          주요 변경
          - Windows 포터블 실행 안정화
          - 브라우저 무한 로딩/RESULT_CODE_HUNG 원인 수정
          - 자동저장 및 비정상 종료 복구 보완
          - 백업 내보내기 / 백업 가져오기 기능 추가
          - 서식 검증용 가상사안 3건 내장
          - 백업·예시데이터 가져오기 후 사안목록 표시 문제 수정
          - ASCII 기반 실행/진단 파일 경로 적용

          주의
          - 현재 hybrid-v0.1 개발 브랜치 기준의 Pre-release입니다.
          - main 브랜치에는 아직 병합하지 않았습니다.
          - 실제 학교폭력 개인정보가 아닌 가상 데이터로 우선 검증해 주세요.
          - HWPX 학교 제출용 출력은 공식 2026 HWPX 원본 구조 검증이 완료된 서식만 사용해야 합니다.
          '@ | Set-Content -Path 'release-notes.txt' -Encoding UTF8

      - name: Create GitHub prerelease
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 'v0.20.7-rc9' 'dist\SchoolSVS_v0.20.7_RC9.zip' `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title 'SchoolSVS v0.20.7 RC9' `
            --notes-file 'release-notes.txt' `
            --prerelease
