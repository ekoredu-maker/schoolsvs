name: SchoolSVS Windows Portable

on:
  workflow_dispatch:
  push:
    branches:
      - hybrid-v0.1
    paths:
      - 'index.html'
      - 'SchoolSVS_실행.bat'
      - 'hybrid/**'
      - '.github/workflows/hybrid-portable-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\hybrid\build_portable.ps1 -PythonVersion '3.11.9' -PackageVersion '0.20.1'

      - name: Verify embedded Python imports real app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'dist\SchoolSVS_Portable'
          $python = Join-Path $root 'hybrid\runtime\python.exe'
          $pth = Join-Path $root 'hybrid\runtime\python311._pth'
          $launcher = Join-Path $root 'SchoolSVS.vbs'
          $entry = Join-Path $root 'hybrid\app\portable_entry.py'
          if (!(Test-Path $python)) { throw 'Embedded python.exe missing.' }
          if (!(Test-Path $pth)) { throw 'python311._pth missing.' }
          if (!(Test-Path $launcher)) { throw 'Root SchoolSVS.vbs launcher missing.' }
          if (!(Test-Path $entry)) { throw 'portable_entry.py missing.' }

          $pthText = Get-Content $pth -Raw
          if ($pthText -notmatch '\.\.\\app') { throw 'Embedded Python app path is missing from python311._pth.' }

          & $python -c "import main, portable_entry; assert main.APP_ID == 'schoolsvs-hybrid'; print('SchoolSVS portable import OK')"
          if ($LASTEXITCODE -ne 0) { throw 'Embedded Python could not import the real application.' }

      - name: Verify distribution contents
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'dist\SchoolSVS_Portable'
          $required = @(
            (Join-Path $root 'SchoolSVS.vbs'),
            (Join-Path $root 'SchoolSVS_Diagnostic.bat'),
            (Join-Path $root 'index.html'),
            (Join-Path $root 'hybrid\SchoolSVS.vbs'),
            (Join-Path $root 'hybrid\run_schoolsvs.bat'),
            (Join-Path $root 'hybrid\PORTABLE_README.txt'),
            (Join-Path $root 'hybrid\runtime\python.exe'),
            (Join-Path $root 'hybrid\runtime\pythonw.exe'),
            (Join-Path $root 'hybrid\app\main.py'),
            (Join-Path $root 'hybrid\app\portable_entry.py')
          )
          foreach ($item in $required) {
            if (!(Test-Path $item)) { throw "Missing portable file: $item" }
          }
          if (Test-Path (Join-Path $root 'hybrid\tests')) { throw 'Tests directory leaked into distribution.' }

      - name: Upload ready-to-use portable folder
        uses: actions/upload-artifact@v4
        with:
          name: SchoolSVS_Portable_Windows_RC3
          path: dist/SchoolSVS_Portable/
          if-no-files-found: error
          retention-days: 14
