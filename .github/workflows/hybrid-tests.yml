name: SchoolSVS Hybrid Tests

on:
  push:
    branches:
      - hybrid-v0.1
  pull_request:
    paths:
      - 'hybrid/**'
      - '.github/workflows/hybrid-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Python modules
        run: python -m compileall -q hybrid/app hybrid/tests

      - name: Run regression tests
        run: python -m unittest discover -s hybrid/tests -p 'test_*.py' -v
