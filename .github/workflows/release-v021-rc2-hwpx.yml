name: Release SchoolSVS v0.21.0 RC2 HWPX

on:
  push:
    branches:
      - hybrid-v0.1
    paths:
      - .github/workflows/release-v021-rc2-hwpx.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python for regression tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Python modules on Windows
        shell: cmd
        run: python -m compileall -q hybrid\app hybrid\tests

      - name: Run HWPX regression tests on Windows
        shell: cmd
        run: |
          python -m unittest discover -s hybrid\tests -p "test_*.py" -v > release-regression-output.txt 2>&1
          set TEST_EXIT=%ERRORLEVEL%
          type release-regression-output.txt
          exit /b %TEST_EXIT%

      - name: Upload Windows regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc2-windows-regression-output
          path: release-regression-output.txt
          if-no-files-found: warn

      - name: Build portable v0.21.0
        shell: powershell
        run: |
          .\hybrid\build_portable.ps1 -PythonVersion '3.11.9' -PackageVersion '0.21.0'
          $source = 'dist\SchoolSVS_Portable_v0.21.0.zip'
          $target = 'dist\SchoolSVS_v0.21.0_RC2_HWPX.zip'
          if (-not (Test-Path $source)) { throw "Portable ZIP was not created: $source" }
          Copy-Item $source $target -Force

      - name: Verify HWPX-capable portable package
        shell: powershell
        run: |
          $zip = 'dist\SchoolSVS_v0.21.0_RC2_HWPX.zip'
          $check = Join-Path $env:RUNNER_TEMP 'schoolsvs_v021_rc2_check'
          if (Test-Path $check) { Remove-Item $check -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $check -Force
          $required = @(
            'SchoolSVS.vbs',
            'SchoolSVS_Diagnostic.bat',
            'hybrid\app\portable_entry.py',
            'hybrid\app\official_2026_direct.py',
            'hybrid\app\chungbuk_form10.py',
            'hybrid\app\chungbuk_form12.py',
            'hybrid\app\form10_markers.py',
            'hybrid\app\form10_student_rows.py',
            'hybrid\web\official-hwpx-ui.js',
            'hybrid\web\document-policy-ui.js',
            'hybrid\web\backup-ui.js',
            'hybrid\sample-data\schoolsvs_sample_cases.json',
            'hybrid\runtime\python.exe'
          )
          foreach ($item in $required) {
            $path = Join-Path $check $item
            if (-not (Test-Path $path)) { throw "Missing release file: $item" }
          }
          $python = Join-Path $check 'hybrid\runtime\python.exe'
          $app = Join-Path $check 'hybrid\app'
          Push-Location $app
          try {
            & $python -c "import official_2026_direct,portable_entry,form10_markers; assert portable_entry.main.VERSION=='0.21.0-rc2'; assert official_2026_direct.FORM10=='form10_case_report'; assert official_2026_direct.FORM12=='form12_investigation_report'; print('RC2 HWPX runtime import OK')"
            if ($LASTEXITCODE -ne 0) { throw 'Embedded Python RC2 HWPX runtime check failed.' }
          } finally { Pop-Location }
          Write-Host 'v0.21.0 RC2 HWPX package verification OK'

      - name: Write release notes
        shell: powershell
        run: |
          @'
          SchoolSVS v0.21.0 RC2 HWPX 시험 배포본

          RC1 이후 핵심 수정
          - 2026 공식 서식10의 분리형 폭력유형 체크박스 구조 지원
          - 체크박스 문자(□/■)만 변경하여 원본 글꼴·노드·배치를 최대한 보존
          - 사안개요에 '언어폭력' 등 동일 용어가 있어도 중첩 '유형' 값 셀만 정확히 처리
          - 2026 공식 서식10의 타학교 통보, 전담조사관 면담시간, 관계회복 의견 값 셀(4열) 지원
          - 2025/기존 구조의 3열 값 셀도 호환 유지
          - 공식 구조 회귀테스트를 추가하고 전체 74개 테스트 통과 후 배포

          HWPX 생성 방식
          - 충청북도교육청 2026 A to Z 공식 HWPX 원본에서 서식10·12를 자동 분리
          - 서식10은 공식 22행×15열 구조를 유지하면서 값 셀과 체크박스만 갱신
          - 서식12는 공식 38행×14열 구조를 기준으로 관련학생 수에 따라 행을 동적으로 확장
          - HWPX mimetype/ZIP 구조 보존

          중요
          - 공식 A to Z 원본 HWPX 자체는 공개 Release ZIP에 포함하지 않습니다.
          - 첫 사용 시 '문서출력 → 2026 공식 HWPX 일괄 등록'에서 공식 서식모음집 HWPX를 한 번 선택해 주세요.
          - 실제 학생 개인정보가 아닌 가상 데이터로 먼저 시험해 주세요.
          - 한컴오피스 한글에서 페이지 넘김·열너비·줄바꿈·인쇄영역은 마지막 육안 확인이 필요합니다.
          - hybrid-v0.1 개발 브랜치 기반 Pre-release이며 main에는 병합하지 않았습니다.
          '@ | Set-Content -Path 'release-notes-v021-rc2.txt' -Encoding UTF8

      - name: Create GitHub prerelease
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 'v0.21.0-rc2-hwpx' 'dist\SchoolSVS_v0.21.0_RC2_HWPX.zip' `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title 'SchoolSVS v0.21.0 RC2 - 2026 HWPX' `
            --notes-file 'release-notes-v021-rc2.txt' `
            --prerelease
