name: Release SchoolSVS v0.21.0 RC1 HWPX

on:
  push:
    branches:
      - hybrid-v0.1
    paths:
      - .github/workflows/release-v021-rc1-hwpx.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build portable v0.21.0
        shell: powershell
        run: |
          .\hybrid\build_portable.ps1 -PythonVersion '3.11.9' -PackageVersion '0.21.0'
          $source = 'dist\SchoolSVS_Portable_v0.21.0.zip'
          $target = 'dist\SchoolSVS_v0.21.0_RC1_HWPX.zip'
          if (-not (Test-Path $source)) { throw "Portable ZIP was not created: $source" }
          Copy-Item $source $target -Force

      - name: Verify HWPX-capable portable package
        shell: powershell
        run: |
          $zip = 'dist\SchoolSVS_v0.21.0_RC1_HWPX.zip'
          $check = Join-Path $env:RUNNER_TEMP 'schoolsvs_v021_rc1_check'
          if (Test-Path $check) { Remove-Item $check -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $check -Force
          $required = @(
            'SchoolSVS.vbs',
            'SchoolSVS_Diagnostic.bat',
            'hybrid\app\portable_entry.py',
            'hybrid\app\official_2026_direct.py',
            'hybrid\app\chungbuk_form10.py',
            'hybrid\app\chungbuk_form12.py',
            'hybrid\app\form10_markers.py',
            'hybrid\app\form10_student_rows.py',
            'hybrid\web\official-hwpx-ui.js',
            'hybrid\web\backup-ui.js',
            'hybrid\web\backup-import-refresh.js',
            'hybrid\sample-data\schoolsvs_sample_cases.json',
            'hybrid\runtime\python.exe'
          )
          foreach ($item in $required) {
            $path = Join-Path $check $item
            if (-not (Test-Path $path)) { throw "Missing release file: $item" }
          }
          $python = Join-Path $check 'hybrid\runtime\python.exe'
          $app = Join-Path $check 'hybrid\app'
          Push-Location $app
          try {
            & $python -c "import official_2026_direct,portable_entry; assert portable_entry.main.VERSION=='0.21.0-rc1'; assert official_2026_direct.FORM10=='form10_case_report'; assert official_2026_direct.FORM12=='form12_investigation_report'; print('HWPX direct runtime import OK')"
            if ($LASTEXITCODE -ne 0) { throw 'Embedded Python HWPX direct runtime check failed.' }
          } finally { Pop-Location }
          Write-Host 'v0.21.0 RC1 HWPX package verification OK'

      - name: Write release notes
        shell: powershell
        run: |
          @'
          SchoolSVS v0.21.0 RC1 HWPX 시험 배포본

          핵심 변경
          - 2026 충북 학교폭력 A to Z 공식 HWPX 구조를 이용한 서식10 직접생성 엔진 추가
          - 2026 공식 서식12 직접생성 엔진 추가
          - 서식12 관련학생 수에 따른 동적 행 생성 지원
          - 문서출력 화면에 '2026 공식 HWPX 일괄 등록' 기능 추가
          - 공식 서식모음집 HWPX 한 파일에서 서식10·12 자동 분리 및 구조검증
          - 기존 서식10 관련학생/체크박스/관계회복 후처리 모듈과 연결
          - 기존 백업/복원, 예시데이터, Windows 포터블 실행 안정화 기능 포함

          중요: 공식 원본 파일 자체는 이 공개 Release ZIP에 포함하지 않습니다.
          첫 사용 시 프로그램의 '문서출력 → 2026 공식 HWPX 일괄 등록'에서
          충청북도교육청의 2026 A to Z 서식모음집 HWPX 원본을 한 번 선택해 주세요.
          이후 서식10·12는 등록된 공식 구조를 유지하면서 Python이 값 셀만 채웁니다.

          검증 범위
          - 공식 2026 HWPX의 서식10 22행×15열 구조 확인
          - 공식 2026 HWPX의 서식12 38행×14열 구조 확인
          - HWPX ZIP/mimetype 구조 보존 확인
          - 가상 데이터로 서식10·12 직접생성 및 서식12 동적 학생행 XML 생성 확인
          - Windows embedded Python에서 직접생성 모듈 import 확인

          아직 필요한 최종 확인
          - 한컴오피스 한글에서 실제 출력물의 페이지 넘김·열너비·줄바꿈을 육안 비교해야 합니다.
          - 이 릴리즈는 hybrid-v0.1 개발 브랜치 기반 Pre-release이며 main에는 병합하지 않았습니다.
          '@ | Set-Content -Path 'release-notes-v021.txt' -Encoding UTF8

      - name: Create GitHub prerelease
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 'v0.21.0-rc1-hwpx' 'dist\SchoolSVS_v0.21.0_RC1_HWPX.zip' `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title 'SchoolSVS v0.21.0 RC1 - 2026 HWPX' `
            --notes-file 'release-notes-v021.txt' `
            --prerelease
